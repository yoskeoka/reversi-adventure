name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Run reversi-engine tests
        run: cargo test -p reversi-engine

      - name: Run reversi-ai tests
        run: cargo test -p reversi-ai

      - name: Build GDExtension library
        run: cargo build -p reversi-godot

      - name: Verify shared library exists
        run: ls target/debug/libreversi_godot.so
